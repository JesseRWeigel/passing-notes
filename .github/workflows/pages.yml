name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# NOT the shared `group: pages`. A single lock means one wedged run blocks every later deploy,
# and a wedged run cannot always be cancelled: this fleet hit a run that returned 502 to both
# cancel and force-cancel and held the lock indefinitely.
#
# The cost is real and is accepted here: runs no longer serialise, so two pushes close together
# can finish out of order and an older commit can overwrite a newer one. That is tolerable for a
# site deployed by hand a few times a year.
concurrency:
  group: pages-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: touch docs/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
